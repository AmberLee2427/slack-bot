name: Maintenance gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: bash -n ops/install-maintenance.sh ops/install-log-size-helper.sh ops/maintenance/*.sh
      - run: python -m unittest discover -s ops/maintenance -p 'test_*.py' -v
