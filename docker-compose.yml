services:
  # Nancy Brain MCP Server
  nancy-brain:
    build:
      context: ./ref/nancy-brain
      dockerfile: Dockerfile
    container_name: nancy-brain-mcp
    ports:
      - "8000:8000"
    environment:
      - MCP_PORT=8000
      - MCP_TRANSPORT=http
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_INVITE_CODES=${MCP_INVITE_CODES}
      - NB_SECRET_KEY=${NB_SECRET_KEY}
      - NB_USE_LOCAL_SUMMARY=${NB_USE_LOCAL_SUMMARY:-false}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - CUSTOM_MODEL=${CUSTOM_MODEL:-}
      - CUSTOM_SUMMARY_MODEL=${CUSTOM_SUMMARY_MODEL:-}
      - CUSTOM_URL=${CUSTOM_URL:-}
      - ALLOW_PICKLE=1
      - TREE_EXCLUDED_PREFIXES=summaries/
      - PYTHONUNBUFFERED=1
      - KMP_DUPLICATE_LIB_OK=TRUE
    volumes:
      - ./ref/nancy-brain/config:/app/config:ro
      - ./ref/nancy-brain/knowledge_base:/app/knowledge_base
      - ./ref/nancy-brain/connectors:/app/connectors
      - ./ref/nancy-brain/nancy_brain:/app/nancy_brain
      - ./ref/nancy-brain/rag_core:/app/rag_core
      - ./ref/nancy-brain/run_mcp_server.py:/app/run_mcp_server.py
      - ./ref/nancy-brain/users.db:/app/users.db
      - nancy-brain-cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - nancy-network

  # Nancy Brain Web UI
  nancy-ui:
    build:
      context: ./ref/nancy-brain
      dockerfile: Dockerfile
    container_name: nancy-brain-ui
    ports:
      - "8501:8501"
    environment:
      - MCP_API_KEY=${MCP_API_KEY}
      - NB_SECRET_KEY=${NB_SECRET_KEY}
      - NB_API_URL=http://nancy-brain:8000
      - NB_USE_LOCAL_SUMMARY=${NB_USE_LOCAL_SUMMARY:-false}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - CUSTOM_MODEL=${CUSTOM_MODEL:-}
      - CUSTOM_SUMMARY_MODEL=${CUSTOM_SUMMARY_MODEL:-}
      - CUSTOM_URL=${CUSTOM_URL:-}
      - PYTHONUNBUFFERED=1
      - KMP_DUPLICATE_LIB_OK=TRUE
    volumes:
      - ./ref/nancy-brain/config:/app/config
      - ./ref/nancy-brain/knowledge_base:/app/knowledge_base
      - ./ref/nancy-brain/nancy_brain:/app/nancy_brain
      - ./ref/nancy-brain/rag_core:/app/rag_core
      - ./ref/nancy-brain/scripts:/app/scripts
      - nancy-brain-cache:/app/cache
    command: streamlit run nancy_brain/admin_ui.py --server.port 8501 --server.address 0.0.0.0 --server.enableCORS false --server.enableXsrfProtection false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8501/_stcore/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - nancy-network

  # Public documentation for users of the hosted microlensing MCP.
  nancy-docs:
    build:
      context: .
      dockerfile: hosted_docs/Dockerfile
    container_name: nancy-hosted-docs
    restart: unless-stopped
    networks:
      - nancy-network

  # Nancy Slack Bot
  nancy-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nancy-slack-bot
    ports:
      - "3000:3000"
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - SLACK_ALLOW_UNSIGNED_REQUESTS=false
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-5}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY:-}
      - CUSTOM_MODEL=${CUSTOM_MODEL:-}
      - CUSTOM_URL=${CUSTOM_URL:-}
      - MCP_BASE_URL=http://nancy-brain:8000
      - MCP_API_KEY=${MCP_API_KEY}
      - DAILY_RATE_LIMIT=${DAILY_RATE_LIMIT:-100}
      - DEBUG_LLM=${DEBUG_LLM:-False}
      - PYTHONUNBUFFERED=1
      - KMP_DUPLICATE_LIB_OK=TRUE
      - PORT=3000
    volumes:
      - ./bot/config:/app/bot/config
    depends_on:
      nancy-brain:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:3000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nancy-network

  # Cloudflare Tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: nancy-tunnel
    restart: unless-stopped
    command: tunnel run nancy
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared
    networks:
      - nancy-network

volumes:
  nancy-brain-cache:
    driver: local

networks:
  nancy-network:
    driver: bridge
