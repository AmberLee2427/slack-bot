name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  # Default is false; set this repository secret or Actions variable to 'true' to enable live MCP integration tests
  MCP_INTEGRATION_TEST: 'false'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

  mcp_integration:
    name: MCP integration tests (gated)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run MCP integration tests
        if: ${{ secrets.MCP_INTEGRATION_TEST == 'true' }}
        env:
          MCP_BASE_URL: ${{ secrets.MCP_BASE_URL }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
        run: pytest -q tests/test_mcp_integration.py -q
