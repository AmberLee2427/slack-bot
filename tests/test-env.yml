name: roman-slack-bot
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - git
  - # runtime and dev packages are installed via pip below to keep the conda spec minimal
  - pip:
    - aiohttp>=3.8.0
    - slack-sdk>=3.18.0
    - slack-bolt>=1.18.0
    - python-dotenv>=1.0.0
    - pyyaml>=5.3
    - requests>=2.28.0
    - regex>=2022.8.17
    # dev dependencies
    - pytest>=7.0.0
    - pytest-asyncio>=0.21.0
    - pytest-aiohttp>=1.1.0
    - black>=23.0.0
    - flake8>=6.0.0

# MacOS users: If you see OpenMP/libomp errors, run: brew install libomp
# If you see "KMP_DUPLICATE_LIB_OK" errors, set: export KMP_DUPLICATE_LIB_OK=TRUE