[project]
name = "nancy-bot"
version = "0.4.3"
description = "Nancy - AI assistant for microlensing research"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.8.0",
    "slack-sdk>=3.18.0",
    "slack-bolt>=1.18.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=5.3",
    "requests>=2.28.0",
    "regex>=2022.8.17",
    "anthropic>=0.18.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-aiohttp>=1.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
