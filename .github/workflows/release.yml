name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (SemVer), with or without leading v (e.g. 0.5.0)"
        required: true
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  hardened-tests:
    name: Hardened Tests (real MCP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bot test dependencies
        run: pip install -e .[dev]

      - name: Install nancy-brain runtime dependencies
        run: pip install -e ./ref/nancy-brain

      - name: Run hardened pytest (real MCP server required)
        env:
          PYTHONPATH: ${{ github.workspace }}
          MCP_TEST_FORCE_STUB: "false"
        run: pytest -q

  github-release:
    name: GitHub Release
    needs: [hardened-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="${{ inputs.version }}"
            version="${raw#v}"
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${version}. Expected SemVer (for example: 0.5.0 or 0.5.0-rc.1)."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject version matches release version
        shell: bash
        run: |
          set -euo pipefail
          pyproject_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"

          if [[ "${pyproject_version}" != "${{ steps.meta.outputs.version }}" ]]; then
            echo "pyproject.toml version (${pyproject_version}) does not match release version (${{ steps.meta.outputs.version }})."
            exit 1
          fi

      - name: Create and push tag (manual releases)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"

          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q "refs/tags/${tag}$"; then
            echo "Tag ${tag} already exists on origin."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

      - name: Create or update GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          title="${tag}"
          extra_flags=()

          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            extra_flags+=(--prerelease)
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --title "${title}" "${extra_flags[@]}"
            echo "Updated existing release ${tag}"
          else
            gh release create "${tag}" --title "${title}" --generate-notes "${extra_flags[@]}"
            echo "Created release ${tag}"
          fi

      - name: Create or update GitHub Release (tag push)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --title "${tag}"
            echo "Updated existing release ${tag}"
          else
            gh release create "${tag}" --title "${tag}" --generate-notes
            echo "Created release ${tag}"
          fi
